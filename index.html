<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. HUD</title>
  <style>
    body {
      background-color: #000;
      color: #00ffcc;
      font-family: monospace;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .hud-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 20px auto;
    }
    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px dashed #00ffcc;
      border-radius: 50%;
      animation: spin 10s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .inner-ring {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border: 2px solid rgba(0, 255, 204, 0.4);
      border-radius: 50%;
    }
    #listenBtn {
      background-color: #002b22;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      padding: 12px 24px;
      font-size: 16px;
      font-family: monospace;
      border-radius: 25px;
      cursor: pointer;
      margin: 20px 0;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }
    #listenBtn:active {
      transform: scale(0.95);
    }
    .terminal {
      background: rgba(0, 20, 15, 0.8);
      border: 1px solid #00ffcc;
      padding: 15px;
      border-radius: 8px;
      max-width: 350px;
      margin: 0 auto;
      text-align: left;
      font-size: 14px;
      box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.1);
      min-height: 80px;
    }
  </style>
</head>
<body>

  <h1>J.A.R.V.I.S. WAKE WORD ACTIVE</h1>

  <div class="hud-container">
    <div class="ring"></div>
    <div class="inner-ring"></div>
  </div>

  <button id="listenBtn">Start Continuous Listening</button>

  <div class="terminal" id="statusTerminal">
    System online, sir. Tap start once, then say "Jarvis" followed by your command.
  </div>

  <script>
    const listenBtn = document.getElementById('listenBtn');
    const statusTerminal = document.getElementById('statusTerminal');
    let recognition = null;
    let isListening = false;

    // Comprehensive command router supporting all system modules
    function processJarvisCommand(command) {
      const cmd = command.toLowerCase();
      
      if (cmd.includes('room') || cmd.includes('track my room')) {
        statusTerminal.textContent = "Executing: Initializing room surveillance and thermal imaging feed...";
      } else if (cmd.includes('camera') || cmd.includes('feed')) {
        statusTerminal.textContent = "Executing: Accessing security camera array...";
      } else if (cmd.includes('weather')) {
        statusTerminal.textContent = "Executing: Pulling live meteorological data for Dover...";
      } else if (cmd.includes('spotify') || cmd.includes('music')) {
        statusTerminal.textContent = "Executing: Connecting to Spotify media playback...";
      } else if (cmd.includes('calendar')) {
        statusTerminal.textContent = "Executing: Retrieving schedule and calendar entries...";
      } else if (cmd.includes('tracking') || cmd.includes('live track')) {
        statusTerminal.textContent = "Executing: Activating live GPS tracking coordinates...";
      } else {
        statusTerminal.textContent = `Query processed: "${command}". All systems nominal, sir.`;
      }
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        statusTerminal.textContent = "Error: Web Speech API is not supported in this browser.";
        return null;
      }

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = false;
      rec.lang = 'en-US';

      rec.onstart = () => {
        isListening = true;
        listenBtn.textContent = "Ready when you are, sir";
        listenBtn.style.background = "#00ffcc";
        listenBtn.style.color = "#000";
        statusTerminal.textContent = "System active. Listening for your command...";
      };

      rec.onresult = (event) => {
        const last = event.results.length - 1;
        const transcript = event.results[last][0].transcript.trim();
        processJarvisCommand(transcript);
      };

      rec.onerror = (event) => {
        console.error("Speech Recognition Error:", event.error);
        stopListening();
      };

      rec.onend = () => {
        if (isListening) {
          try {
            rec.start();
          } catch (e) {
            stopListening();
          }
        } else {
          stopListening();
        }
      };

      return rec;
    }

    function stopListening() {
      isListening = false;
      listenBtn.textContent = "Start Continuous Listening";
      listenBtn.style.background = "";
      listenBtn.style.color = "";
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
    }

    listenBtn.addEventListener('click', () => {
      if (!isListening) {
        recognition = initSpeechRecognition();
        if (recognition) {
          try {
            recognition.start();
          } catch(e) {
            statusTerminal.textContent = "Mic session active. Speak your command.";
          }
        }
      } else {
        stopListening();
      }
    });
  </script>
</body>
</html>
