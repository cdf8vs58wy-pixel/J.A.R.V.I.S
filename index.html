<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. HUD</title>
  <style>
    body {
      background-color: #000;
      color: #00ffcc;
      font-family: monospace;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .hud-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 20px auto;
    }
    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px dashed #00ffcc;
      border-radius: 50%;
      animation: spin 10s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .inner-ring {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border: 2px solid rgba(0, 255, 204, 0.4);
      border-radius: 50%;
    }
    #listenBtn {
      background-color: #002b22;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      padding: 12px 24px;
      font-size: 16px;
      font-family: monospace;
      border-radius: 25px;
      cursor: pointer;
      margin: 20px 0;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }
    #listenBtn:active {
      transform: scale(0.95);
    }
    .terminal {
      background: rgba(0, 20, 15, 0.8);
      border: 1px solid #00ffcc;
      padding: 15px;
      border-radius: 8px;
      max-width: 350px;
      margin: 0 auto;
      text-align: left;
      font-size: 14px;
      box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.1);
      min-height: 80px;
    }
  </style>
</head>
<body>

  <h1>J.A.R.V.I.S. WAKE WORD ACTIVE</h1>

  <div class="hud-container">
    <div class="ring"></div>
    <div class="inner-ring"></div>
  </div>

  <button id="listenBtn">Start Continuous Listening</button>

  <div class="terminal" id="statusTerminal">
    System online, sir. Tap start once, then state your query.
  </div>

  <script>
    const listenBtn = document.getElementById('listenBtn');
    const statusTerminal = document.getElementById('statusTerminal');
    let recognition = null;
    let isListening = false;
    let silenceTimer = null;
    let finalTranscript = "";

    // Text-to-Speech function for J.A.R.V.I.S. voice replies
    function speak(text, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 0.9;
        if (callback) {
          utterance.onend = callback;
        }
        window.speechSynthesis.speak(utterance);
      } else if (callback) {
        callback();
      }
    }

    // Command router covering all system features
    function processJarvisCommand(command) {
      if (!command) return;
      const cmd = command.toLowerCase();
      let responseText = "";
      
      if (cmd.includes('room') || cmd.includes('track my room')) {
        responseText = "Initializing room surveillance and thermal imaging feed, sir.";
      } else if (cmd.includes('camera') || cmd.includes('feed')) {
        responseText = "Accessing security camera array now.";
      } else if (cmd.includes('weather')) {
        responseText = "Pulling live meteorological data for your location.";
      } else if (cmd.includes('spotify') || cmd.includes('music')) {
        responseText = "Connecting to Spotify media playback.";
      } else if (cmd.includes('calendar')) {
        responseText = "Retrieving your schedule and calendar entries.";
      } else if (cmd.includes('tracking') || cmd.includes('live track')) {
        responseText = "Activating live GPS tracking coordinates.";
      } else if (cmd.includes('time')) {
        const now = new Date();
        responseText = `The time is ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}, sir.`;
      } else {
        responseText = `Query processed: "${command}". All systems nominal, sir.`;
      }

      statusTerminal.textContent = `Command: "${command}"\nResponse: ${responseText}`;
      speak(responseText);
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        statusTerminal.textContent = "Error: Web Speech API is not supported in this browser.";
        return null;
      }

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-US';

      rec.onstart = () => {
        isListening = true;
        listenBtn.textContent = "Ready when you are, sir";
        listenBtn.style.background = "#00ffcc";
        listenBtn.style.color = "#000";
        statusTerminal.textContent = "System active. Listening...";
      };

      rec.onresult = (event) => {
        let interim = "";
        finalTranscript = "";

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        const currentSpeech = finalTranscript || interim;
        if (currentSpeech) {
          statusTerminal.textContent = `Hearing: "${currentSpeech}"`;
          
          // Clear previous silence timer on new sound
          clearTimeout(silenceTimer);
          
          // Automatically process query after 2 seconds of silence
          silenceTimer = setTimeout(() => {
            try { rec.stop(); } catch(e) {}
            processJarvisCommand(currentSpeech.trim());
            stopListening();
          }, 2000);
        }
      };

      rec.onerror = (event) => {
        console.error("Speech Recognition Error:", event.error);
        stopListening();
      };

      rec.onend = () => {
        if (isListening && !finalTranscript) {
          try { rec.start(); } catch (e) { stopListening(); }
        }
      };

      return rec;
    }

    function stopListening() {
      isListening = false;
      clearTimeout(silenceTimer);
      listenBtn.textContent = "Start Continuous Listening";
      listenBtn.style.background = "";
      listenBtn.style.color = "";
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
    }

    listenBtn.addEventListener('click', () => {
      if (!isListening) {
        // Speak "Yes, sir" first, then fire up the microphone
        speak("Yes, sir", () => {
          recognition = initSpeechRecognition();
          if (recognition) {
            try {
              recognition.start();
            } catch(e) {
              statusTerminal.textContent = "Mic active. Speak your command.";
            }
          }
        });
      } else {
        stopListening();
      }
    });
  </script>
</body>
</html>
