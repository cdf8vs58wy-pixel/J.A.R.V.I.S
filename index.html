<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. HUD</title>
    <style>
        body {
            background-color: #000;
            color: #00ffcc;
            font-family: monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { font-size: 24px; letter-spacing: 2px; text-shadow: 0 0 10px #00ffcc; }
        .hud-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 30px auto;
        }
        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px dashed rgba(0, 255, 204, 0.4);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }
        .inner-ring {
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 2px solid #00ffcc;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin-reverse 6s linear infinite;
        }
        .hud-image {
            position: absolute;
            top: 40px; left: 40px; right: 40px; bottom: 40px;
            background-image: url('image.png');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            box-shadow: 0 0 20px #00ffcc;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        #console {
            background: rgba(0, 20, 20, 0.8);
            border: 1px solid #00ffcc;
            padding: 15px;
            border-radius: 8px;
            max-width: 400px;
            margin: 20px auto;
            text-align: left;
            height: 150px;
            overflow-y: auto;
            font-size: 14px;
        }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ffcc;
            margin-top: 10px;
        }
    </style>
</head>
