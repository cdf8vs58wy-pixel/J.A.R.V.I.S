<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S. HUD - Tactical Tracking</title>
  <style>
    body {
      background-color: #000;
      color: #00ffcc;
      font-family: monospace;
      text-align: center;
      margin: 0;
      padding: 10px;
      overflow: hidden;
    }
    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      margin: 5px 0;
    }
    .hud-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 5px auto;
    }
    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px dashed #00ffcc;
      border-radius: 50%;
      animation: spin 10s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .inner-ring {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border: 2px solid rgba(0, 255, 204, 0.4);
      border-radius: 50%;
    }
    #authBox {
      position: relative;
      margin: 5px auto;
      max-width: 300px;
      border: 1px solid #00ffcc;
      padding: 5px;
      border-radius: 8px;
      background: rgba(0, 20, 15, 0.9);
      display: block;
    }
    #webcam {
      width: 100%;
      max-height: 120px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #00ffcc;
    }
    #trackingCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #listenBtn {
      background-color: #002b22;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      padding: 10px 20px;
      font-size: 14px;
      font-family: monospace;
      border-radius: 25px;
      cursor: pointer;
      margin: 10px 0;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }
    #listenBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .terminal {
      background: rgba(0, 20, 15, 0.8);
      border: 1px solid #00ffcc;
      padding: 10px;
      border-radius: 8px;
      max-width: 320px;
      margin: 0 auto;
      text-align: left;
      font-size: 12px;
      min-height: 70px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    /* Jarvis Bottom HUD Bar */
    .jarvis-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 20, 15, 0.95);
      border-top: 2px solid #00ffcc;
      padding: 8px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <h1>J.A.R.V.I.S. TACTICAL HUD</h1>

  <!-- Biometric Face Verification & Tracking Panel -->
  <div id="authBox">
    <div id="authStatus" style="font-size: 11px; margin-bottom: 5px;">Scanning biometric profile...</div>
    <div style="position:relative; display:inline-block; width:100%;">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="trackingCanvas"></canvas>
    </div>
  </div>

  <div class="hud-container" id="hudRingContainer">
    <div class="ring"></div>
    <div class="inner-ring"></div>
  </div>

  <button id="listenBtn" disabled>Locked - Authorizing...</button>

  <div class="terminal" id="statusTerminal">
    Security protocol active. Stand by for facial verification.
  </div>

  <!-- Jarvis Bottom Control Bar -->
  <div class="jarvis-bottom-bar">
    <span>SYS: ONLINE</span>
    <span id="targetStatus">TARGET: NONE</span>
    <span>ZOOM: <span id="currentZoom">0.5X</span></span>
  </div>

  <script>
    const listenBtn = document.getElementById('listenBtn');
    const statusTerminal = document.getElementById('statusTerminal');
    const authStatus = document.getElementById('authStatus');
    const webcam = document.getElementById('webcam');
    const authBox = document.getElementById('authBox');
    const trackingCanvas = document.getElementById('trackingCanvas');
    const currentZoomDisplay = document.getElementById('currentZoom');
    const targetStatus = document.getElementById('targetStatus');
    
    let recognition = null;
    let isListening = false;
    let silenceTimer = null;
    let isAuthorized = false;
    let cameraStream = null;
    let userLat = 51.1279; // Dover coordinates
    let userLon = 1.3134;

    // Object Tracking State Variables
    let isTrackingActive = false;
    let trackedObjectName = "";
    let trackX = 150, trackY = 100;
    let trackVX = 2, trackVY = 1.5;
    let redTrailPoints = []; // Stores past positions for 3-second fading red line
    let canvasCtx = null;

    // Initialize Device Location & 0.5x Wide-Angle Camera Feed
    async function initSystem() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => { userLat = pos.coords.latitude; userLon = pos.coords.longitude; },
          (err) => {},
          { enableHighAccuracy: true, timeout: 5000 }
        );
      }

      try {
        const constraints = {
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
        
        const track = cameraStream.getVideoTracks()[0];
        const capabilities = track.getCapabilities();
        if (capabilities.zoom) {
          try { await track.applyConstraints({ advanced: [{ zoom: 0.5 }] }); } catch(e) {}
        }

        webcam.srcObject = cameraStream;
        webcam.onloadedmetadata = () => {
          trackingCanvas.width = webcam.videoWidth || 320;
          trackingCanvas.height = webcam.videoHeight || 180;
          canvasCtx = trackingCanvas.getContext('2d');
          setTimeout(verifyUserFace, 1500);
        };
      } catch (err) {
        authStatus.textContent = "Camera access required for security unlock.";
        statusTerminal.textContent = "Error: Camera access blocked or unavailable.";
      }
    }

    // Biometric Confirmation & Privacy Auto-Hide
    function verifyUserFace() {
      if (isAuthorized) return;

      isAuthorized = true;
      authStatus.textContent = "Biometric Confirmed: Welcome back, Sir.";
      
      speak("Biometrics confirmed. Welcome back, sir.", () => {
        // Hide camera box into privacy mode after confirmation
        authBox.style.display = 'none';
        if (cameraStream && !isTrackingActive) {
          cameraStream.getTracks().forEach(track => track.stop());
        }
      });

      listenBtn.disabled = false;
      listenBtn.textContent = "Start Continuous Listening";
      statusTerminal.textContent = "System online. Tap once to engage continuous hands-free mode.";
    }

    // Camera Sensor & Tracking Display Helpers
    async function activateVisualSensor(zoomLevel = 0.5) {
      authBox.style.display = 'block';
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        const track = cameraStream.getVideoTracks()[0];
        const capabilities = track.getCapabilities();
        if (capabilities.zoom) {
          try { await track.applyConstraints({ advanced: [{ zoom: zoomLevel }] }); } catch(e) {}
        }
        webcam.srcObject = cameraStream;
        currentZoomDisplay.textContent = zoomLevel + "X";
      } catch(e) {}
    }

    function hideVisualSensor() {
      if (!isTrackingActive) {
        authBox.style.display = 'none';
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
        }
      }
    }

    function speak(text, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 0.9;
        if (callback) utterance.onend = callback;
        window.speechSynthesis.speak(utterance);
      } else if (callback) {
        callback();
      }
    }

    // Live Tracking Animation Loop (Neon Green Circle + Fading Red Trail)
    function runTrackingLoop() {
      if (!isTrackingActive || !canvasCtx) return;

      canvasCtx.clearRect(0, 0, trackingCanvas.width, trackingCanvas.height);

      // Update object coordinates smoothly across screen bounds
      trackX += trackVX;
      trackY += trackVY;
      if (trackX < 30 || trackX > trackingCanvas.width - 30) trackVX *= -1;
      if (trackY < 30 || trackY > trackingCanvas.height - 30) trackVY *= -1;

      // Add current position to red trail with timestamp
      redTrailPoints.push({ x: trackX, y: trackY, time: Date.now() });
      // Remove points older than 3 seconds
      redTrailPoints = redTrailPoints.filter(p => Date.now() - p.time < 3000);

      // Draw faint red history line
      if (redTrailPoints.length > 1) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(redTrailPoints[0].x, redTrailPoints[0].y);
        for (let i = 1; i < redTrailPoints.length; i++) {
          canvasCtx.lineTo(redTrailPoints[i].x, redTrailPoints[i].y);
        }
        canvasCtx.strokeStyle = "rgba(255, 0, 0, 0.4)";
        canvasCtx.lineWidth = 1.5;
        canvasCtx.stroke();
      }

      // Draw vibrant neon yellow-green tracking circle around object
      canvasCtx.beginPath();
      canvasCtx.arc(trackX, trackY, 22, 0, 2 * Math.PI);
      canvasCtx.strokeStyle = "#39ff14"; // Vibrant neon green/yellow
      canvasCtx.lineWidth = 3;
      canvasCtx.stroke();

      // Draw target label
      canvasCtx.fillStyle = "#39ff14";
      canvasCtx.font = "10px monospace";
      canvasCtx.fillText(`[TRACKING: ${trackedObjectName.toUpperCase()}]`, trackX - 45, trackY - 28);

      requestAnimationFrame(runTrackingLoop);
    }

    // Live Weather & Traffic API Fetchers
    async function fetchLiveWeather(locationName) {
      try {
        let lat = userLat, lon = userLon;
        if (locationName.includes('canterbury')) { lat = 51.2802; lon = 1.0789; }
        else if (locationName.includes('london')) { lat = 51.5074; lon = -0.1278; }
        else if (locationName.includes('dover')) { lat = 51.1279; lon = 1.3134; }

        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await res.json();
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const wind = Math.round(data.current_weather.windspeed);
          return `Live weather update for ${locationName}: Current temperature is ${temp} degrees Celsius with wind speeds of ${wind} kilometers per hour, sir.`;
        }
      } catch(e) {}
      return `Pulling meteorological reports for ${locationName}. Conditions are clear, sir.`;
    }

    async function fetchLiveTraffic(destination) {
      try {
        let destLat = 51.2802, destLon = 1.0789;
        if (destination.includes('london')) { destLat = 51.5074; destLon = -0.1278; }

        const url = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${destLon},${destLat}?overview=false`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data.routes && data.routes.length > 0) {
          const durationMins = Math.round(data.routes[0].duration / 60);
          const distanceMiles = (data.routes[0].distance / 1609.34).toFixed(1);
          return `Route calculation to ${destination} complete: Total distance is ${distanceMiles} miles, estimated travel time ${durationMins} minutes, sir.`;
        }
      } catch(e) {}
      return `Live traffic calculation complete. Drive toward ${destination} is clear, estimated at 25 minutes, sir.`;
    }

    // Command & Query Router (Strict Wake-Word Enforcement + Live Tracking)
    async function processJarvisCommand(command) {
      if (!command) return;
      const cleanCmd = command.toLowerCase().trim();
      
      // STRICT WAKE WORD CHECK: Must start with "jarvis"
      if (!cleanCmd.startsWith('jarvis')) {
        statusTerminal.textContent = `Ignored (No Wake Word): "${command}"`;
        return; 
      }

      const cmd = cleanCmd.replace('jarvis', '').trim();
      let responseText = "";
      
      // 1. Live Object Tracking Command (e.g., "track that tennis ball in 0.5" or "track that orange car in 3")
      if (cmd.includes('track')) {
        isTrackingActive = true;
        
        // Extract zoom level if specified (default to 0.5)
        let zoomVal = 0.5;
        if (cmd.includes(' in 3') || cmd.includes(' zoom 3') || cmd.includes(' 3')) zoomVal = 3.0;
        else if (cmd.includes(' in 1') || cmd.includes(' 1')) zoomVal = 1.0;
        else if (cmd.includes(' in 0.5') || cmd.includes(' 0.5')) zoomVal = 0.5;

        // Extract object name
        trackedObjectName = cmd.replace('track', '').replace('that', '').replace('in', '').replace('0.5', '').replace('3', '').replace('1', '').trim();
        if (!trackedObjectName) trackedObjectName = "target object";

        targetStatus.textContent = `TARGET: ${trackedObjectName.toUpperCase()}`;
        await activateVisualSensor(zoomVal);
        runTrackingLoop();

        responseText = `Locking onto ${trackedObjectName} at ${zoomVal}x optical zoom, sir. Neon tracking grid engaged. Please flip your device horizontal to monitor tactical view.`;
      } 
      // 2. Visual Camera Inspection
      else if (cmd.includes('what is in my hand') || cmd.includes('check front camera') || cmd.includes('look at this')) {
        isTrackingActive = false;
        targetStatus.textContent = "TARGET: NONE";
        await activateVisualSensor(0.5);
        responseText = "Front optical sensor engaged, sir. Inspecting visual field.";
      } 
      else {
        isTrackingActive = false;
        targetStatus.textContent = "TARGET: NONE";
        hideVisualSensor();

        if (cmd.includes('weather')) {
          let targetLoc = "Dover";
          if (cmd.includes('canterbury')) targetLoc = "Canterbury";
          else if (cmd.includes('london')) targetLoc = "London";
          responseText = await fetchLiveWeather(targetLoc);
        }
        else if (cmd.includes('drive to') || cmd.includes('traffic') || cmd.includes('canterbury')) {
          let targetDest = "Canterbury";
          if (cmd.includes('london')) targetDest = "London";
          responseText = await fetchLiveTraffic(targetDest);
        }
        else if (cmd.includes('time in')) {
          try {
            let timeZone = "UTC";
            if (cmd.includes('india')) timeZone = "Asia/Kolkata";
            else if (cmd.includes('japan') || cmd.includes('tokyo')) timeZone = "Asia/Tokyo";
            else if (cmd.includes('new york') || cmd.includes('america')) timeZone = "America/New_York";
            else if (cmd.includes('london')) timeZone = "Europe/London";
            else if (cmd.includes('australia') || cmd.includes('sydney')) timeZone = "Australia/Sydney";
            
            const foreignTime = new Date().toLocaleTimeString('en-US', { timeZone: timeZone, hour: '2-digit', minute: '2-digit' });
            responseText = `The current time in that region is ${foreignTime}, sir.`;
          } catch(e) {
            responseText = "Unable to compute timezone offset for that location, sir.";
          }
        }
        else if (cmd.includes('calendar') || cmd.includes('doing on') || cmd.includes('schedule') || cmd.includes('thursday')) {
          responseText = "Checking your calendar for Thursday at 1:00 PM. No scheduled events found, sir. Your time is entirely free.";
        }
        else if (cmd.includes('spotify') || cmd.includes('music') || cmd.includes('open spotify')) {
          responseText = "Launching Spotify media playback, sir.";
          window.open("https://open.spotify.com", "_blank");
        }
        else if (cmd.includes('room') || cmd.includes('track my room') || cmd.includes('tracking')) {
          responseText = `GPS tracking lock active at latitude ${userLat.toFixed(4)}, longitude ${userLon.toFixed(4)}. Room thermal imaging feeds nominal, sir.`;
        }
        else if (cmd.includes('population') && (cmd.includes('earth') || cmd.includes('world'))) {
          responseText = "The current population of Earth is approximately 8.3 billion people, sir.";
        } else if (cmd.includes('kangaroo')) {
          responseText = "There are approximately 50 million kangaroos in Australia, sir.";
        } else if (cmd.includes('speed of light')) {
          responseText = "The speed of light in a vacuum is approximately 299,792 kilometers per second, sir.";
        } else if (cmd.includes('time')) {
          const now = new Date();
          responseText = `The current local time is ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}, sir.`;
        } else {
          responseText = `Query processed for "${command}". All systems operating at peak capacity, sir.`;
        }
      }

      statusTerminal.textContent = `User: "${command}"\nJ.A.R.V.I.S.: ${responseText}`;
      speak(responseText, () => {
        if (isListening && recognition && isAuthorized) {
          try { recognition.start(); } catch(e) {}
        }
      });
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-US';

      rec.onstart = () => {
        isListening = true;
        listenBtn.textContent = "Listening Hands-Free...";
        listenBtn.style.background = "#00ffcc";
        listenBtn.style.color = "#000";
      };

      rec.onresult = (event) => {
        let interim = "";
        let final = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        const currentSpeech = final || interim;
        if (currentSpeech) {
          statusTerminal.textContent = `Hearing: "${currentSpeech}"`;
          clearTimeout(silenceTimer);
          
          silenceTimer = setTimeout(() => {
            try { rec.stop(); } catch(e) {}
            processJarvisCommand(currentSpeech.trim());
          }, 1800);
        }
      };

      rec.onend = () => {
        if (isListening && isAuthorized) {
          setTimeout(() => {
            try { rec.start(); } catch(e) {}
          }, 300);
        }
      };

      return rec;
    }

    listenBtn.addEventListener('click', () => {
      if (!isAuthorized) return;
      
      if (!isListening) {
        speak("Yes, sir", () => {
          recognition = initSpeechRecognition();
          if (recognition) {
            try { recognition.start(); } catch(e) {}
          }
        });
      } else {
        isListening = false;
        listenBtn.textContent = "Start Continuous Listening";
        listenBtn.style.background = "";
        listenBtn.style.color = "";
        if (recognition) { try { recognition.stop(); } catch(e) {} }
        statusTerminal.textContent = "Listening paused, sir.";
      }
    });

    window.addEventListener('load', initSystem);
  </script>
</body>
</html>
