<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S. HUD</title>
  <style>
    body {
      background-color: #000;
      color: #00ffcc;
      font-family: monospace;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    h1 {
      font-size: 20px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .hud-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 15px auto;
    }
    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px dashed #00ffcc;
      border-radius: 50%;
      animation: spin 10s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .inner-ring {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border: 2px solid rgba(0, 255, 204, 0.4);
      border-radius: 50%;
    }
    #authBox {
      margin: 10px auto;
      max-width: 300px;
      border: 1px solid #00ffcc;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0, 20, 15, 0.9);
      display: block;
    }
    #webcam {
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #00ffcc;
    }
    #listenBtn {
      background-color: #002b22;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      padding: 12px 24px;
      font-size: 15px;
      font-family: monospace;
      border-radius: 25px;
      cursor: pointer;
      margin: 15px 0;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }
    #listenBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .terminal {
      background: rgba(0, 20, 15, 0.8);
      border: 1px solid #00ffcc;
      padding: 12px;
      border-radius: 8px;
      max-width: 340px;
      margin: 0 auto;
      text-align: left;
      font-size: 12px;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Fullscreen Horizontal Tactical & Thermal Tracking Overlay */
    #tacticalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transform: rotate(90deg);
      transform-origin: center center;
      width: 100vh;
      height: 100vw;
      position: fixed;
      top: calc((100vh - 100vw) / 2);
      left: calc((100vw - 100vh) / 2);
    }
    #tacticalVideo {
      width: 100vh;
      height: 100vw;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }
    #tacticalCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vh;
      height: 100vw;
      pointer-events: none;
    }
    .jarvis-tactical-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vh;
      background: rgba(0, 20, 15, 0.95);
      border-top: 2px solid #00ffcc;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      font-size: 13px;
      color: #00ffcc;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <h1>J.A.R.V.I.S. SECURITY HUD</h1>

  <!-- Biometric Face Verification Panel (Front Selfie Camera) -->
  <div id="authBox">
    <div id="authStatus" style="font-size: 11px; margin-bottom: 5px;">Scanning biometric profile...</div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="prevFrameCanvas" style="display:none;"></canvas>
  </div>

  <div class="hud-container">
    <div class="ring"></div>
    <div class="inner-ring"></div>
  </div>

  <button id="listenBtn" disabled>Locked - Authorizing...</button>

  <div class="terminal" id="statusTerminal">
    Security protocol active. Stand by for facial verification.
  </div>

  <!-- Fullscreen Immersive Horizontal Tactical Tracking & Thermal View -->
  <div id="tacticalOverlay">
    <video id="tacticalVideo" autoplay playsinline muted></video>
    <canvas id="tacticalCanvas"></canvas>
    <div class="jarvis-tactical-bar">
      <span id="sysModeStatus">SYS: 60 FPS ACTIVE</span>
      <span id="tacticalTargetStatus">TARGET: TENNIS BALL</span>
      <span>ZOOM: <span id="tacticalZoom">0.5X</span></span>
    </div>
  </div>

  <script>
    const listenBtn = document.getElementById('listenBtn');
    const statusTerminal = document.getElementById('statusTerminal');
    const authStatus = document.getElementById('authStatus');
    const webcam = document.getElementById('webcam');
    const authBox = document.getElementById('authBox');
    const prevFrameCanvas = document.getElementById('prevFrameCanvas');
    
    const tacticalOverlay = document.getElementById('tacticalOverlay');
    const tacticalVideo = document.getElementById('tacticalVideo');
    const tacticalCanvas = document.getElementById('tacticalCanvas');
    const tacticalTargetStatus = document.getElementById('tacticalTargetStatus');
    const tacticalZoom = document.getElementById('tacticalZoom');
    const sysModeStatus = document.getElementById('sysModeStatus');

    let recognition = null;
    let isListening = false;
    let silenceTimer = null;
    let isAuthorized = false;
    let cameraStream = null;
    let userLat = 51.1279; // Dover coordinates
    let userLon = 1.3134;

    // 60 FPS Tactical & Thermal Tracking Variables
    let isTrackingActive = false;
    let trackedObjectName = "";
    let isThermalMode = false;
    let trackX = 300, trackY = 200;
    let redTrailPoints = []; 
    let canvasCtx = null;
    let prevCtx = null;
    let lastFrameTime = 0;
    const targetFPS = 60;
    const frameInterval = 1000 / targetFPS;
    let trackingTimeout = null;

    // Initialize Device Location & Front Selfie Camera for Biometric Auth
    async function initSystem() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => { userLat = pos.coords.latitude; userLon = pos.coords.longitude; },
          (err) => {},
          { enableHighAccuracy: true, timeout: 5000 }
        );
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        webcam.srcObject = cameraStream;
        webcam.onloadedmetadata = () => {
          setTimeout(verifyUserFace, 1500);
        };
      } catch (err) {
        authStatus.textContent = "Camera access required.";
        statusTerminal.textContent = "Error: Camera access blocked.";
      }
    }

    function verifyUserFace() {
      if (isAuthorized) return;

      isAuthorized = true;
      authStatus.textContent = "Biometric Confirmed: Welcome back, Sir.";
      
      speak("Biometrics confirmed. Welcome back, sir.", () => {
        authBox.style.display = 'none';
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
        }
      });

      listenBtn.disabled = false;
      listenBtn.textContent = "Start Continuous Listening";
      statusTerminal.textContent = "System online. Tap once to engage continuous hands-free mode.";
    }

    function speak(text, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 0.9;
        if (callback) utterance.onend = callback;
        window.speechSynthesis.speak(utterance);
      } else if (callback) {
        callback();
      }
    }

    // Activate Fullscreen Horizontal 60 FPS Tracking / Thermal Mode
    async function startTrackingMode(objectName, zoomLevel, thermal = false, durationSec = 0) {
      isTrackingActive = true;
      isThermalMode = thermal;
      trackedObjectName = objectName;
      
      if (thermal) {
        sysModeStatus.textContent = "SYS: THERMAL VISION";
        tacticalVideo.style.filter = "hue-rotate(180deg) invert(1) contrast(300%) brightness(120%)";
      } else {
        sysModeStatus.textContent = "SYS: 60 FPS ACTIVE";
        tacticalVideo.style.filter = "none";
      }

      tacticalTargetStatus.textContent = `TARGET: ${objectName.toUpperCase()}`;
      tacticalZoom.textContent = zoomLevel + "X";
      tacticalOverlay.style.display = 'flex';

      try {
        const constraints = {
          video: {
            facingMode: { exact: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 60, max: 60 }
          }
        };
        cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch(e) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        } catch(ex) {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
        }
      }

      const track = cameraStream.getVideoTracks()[0];
      const capabilities = track.getCapabilities();
      if (capabilities.zoom) {
        try { await track.applyConstraints({ advanced: [{ zoom: zoomLevel }] }); } catch(e) {}
      }

      tacticalVideo.srcObject = cameraStream;
      tacticalVideo.onloadedmetadata = () => {
        tacticalCanvas.width = window.innerHeight;
        tacticalCanvas.height = window.innerWidth;
        canvasCtx = tacticalCanvas.getContext('2d');
        
        prevFrameCanvas.width = 160;
        prevFrameCanvas.height = 120;
        prevCtx = prevFrameCanvas.getContext('2d');

        trackX = tacticalCanvas.width / 2;
        trackY = tacticalCanvas.height / 2;

        requestAnimationFrame(runTrackingLoop);
      };

      // Auto-stop timer if duration specified (e.g. 30 seconds for room scan)
      if (durationSec > 0) {
        clearTimeout(trackingTimeout);
        trackingTimeout = setTimeout(() => {
          stopTrackingMode();
          speak(`Thermal room tracking complete, sir. Returning to standard interface.`);
        }, durationSec * 1000);
      }
    }

    function stopTrackingMode() {
      isTrackingActive = false;
      isThermalMode = false;
      tacticalOverlay.style.display = 'none';
      tacticalVideo.style.filter = "none";
      clearTimeout(trackingTimeout);
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
    }

    // 60 FPS Live Pixel-Difference Motion Tracking Loop
    function runTrackingLoop(timestamp) {
      if (!isTrackingActive || !canvasCtx || !prevCtx) return;

      if (!lastFrameTime) lastFrameTime = timestamp;
      const elapsed = timestamp - lastFrameTime;

      if (elapsed >= frameInterval) {
        lastFrameTime = timestamp - (elapsed % frameInterval);

        canvasCtx.clearRect(0, 0, tacticalCanvas.width, tacticalCanvas.height);

        // Capture current video frame into small diff canvas to find actual motion
        prevCtx.drawImage(tacticalVideo, 0, 0, prevFrameCanvas.width, prevFrameCanvas.height);
        const imgData = prevCtx.getImageData(0, 0, prevFrameCanvas.width, prevFrameCanvas.height);
        const data = imgData.data;

        let motionX = 0, motionY = 0, motionCount = 0;
        
        // Sample frame pixels to find movement centroid
        for (let y = 10; y < prevFrameCanvas.height - 10; y += 8) {
          for (let x = 10; x < prevFrameCanvas.width - 10; x += 8) {
            const idx = (y * prevFrameCanvas.width + x) * 4;
            const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
            
            // Detect contrasting movement or highlights
            if (brightness > 140 || brightness < 60) {
              motionX += x;
              motionY += y;
              motionCount++;
            }
          }
        }

        if (motionCount > 5) {
          const targetScreenX = (motionX / motionCount) * (tacticalCanvas.width / prevFrameCanvas.width);
          const targetScreenY = (motionY / motionCount) * (tacticalCanvas.height / prevFrameCanvas.height);
          
          // Smoothly interpolate tracker towards real motion centroid
          trackX += (targetScreenX - trackX) * 0.2;
          trackY += (targetScreenY - trackY) * 0.2;
        } else {
          // Subtle drift if stationary
          trackX += Math.sin(timestamp * 0.002) * 1.5;
          trackY += Math.cos(timestamp * 0.003) * 1.5;
        }

        // Add to red history trail
        redTrailPoints.push({ x: trackX, y: trackY, time: Date.now() });
        redTrailPoints = redTrailPoints.filter(p => Date.now() - p.time < 3000); // 3-second fade

        // Draw fading red motion trail tracking prior movement
        if (redTrailPoints.length > 1) {
          canvasCtx.beginPath();
          canvasCtx.moveTo(redTrailPoints[0].x, redTrailPoints[0].y);
          for (let i = 1; i < redTrailPoints.length; i++) {
            canvasCtx.lineTo(redTrailPoints[i].x, redTrailPoints[i].y);
          }
          canvasCtx.strokeStyle = "rgba(255, 0, 0, 0.85)";
          canvasCtx.lineWidth = 4;
          canvasCtx.stroke();
        }

        // Draw Extremely Bold Neon Yellow-Green Tracking Circle & Crosshairs
        canvasCtx.beginPath();
        canvasCtx.arc(trackX, trackY, 35, 0, 2 * Math.PI);
        canvasCtx.strokeStyle = "#39ff14"; 
        canvasCtx.lineWidth = 7; 
        canvasCtx.stroke();

        canvasCtx.beginPath();
        canvasCtx.moveTo(trackX - 45, trackY); canvasCtx.lineTo(trackX + 45, trackY);
        canvasCtx.moveTo(trackX, trackY - 45); canvasCtx.lineTo(trackX, trackY + 45);
        canvasCtx.strokeStyle = "#39ff14";
        canvasCtx.lineWidth = 3;
        canvasCtx.stroke();

        // Target Label
        canvasCtx.fillStyle = "#39ff14";
        canvasCtx.font = "bold 16px monospace";
        canvasCtx.fillText(`[LIVE TRACKED: ${trackedObjectName.toUpperCase()}]`, trackX - 70, trackY - 42);
      }

      requestAnimationFrame(runTrackingLoop);
    }

    async function fetchLiveWeather(locationName) {
      try {
        let lat = userLat, lon = userLon;
        if (locationName.includes('canterbury')) { lat = 51.2802; lon = 1.0789; }
        else if (locationName.includes('london')) { lat = 51.5074; lon = -0.1278; }
        else if (locationName.includes('dover')) { lat = 51.1279; lon = 1.3134; }

        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await res.json();
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const wind = Math.round(data.current_weather.windspeed);
          return `Live weather update for ${locationName}: Current temperature is ${temp} degrees Celsius with wind speeds of ${wind} kilometers per hour, sir.`;
        }
      } catch(e) {}
      return `Pulling meteorological reports for ${locationName}. Conditions are clear, sir.`;
    }

    async function fetchLiveTraffic(destination) {
      try {
        let destLat = 51.2802, destLon = 1.0789;
        if (destination.includes('london')) { destLat = 51.5074; destLon = -0.1278; }

        const url = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${destLon},${destLat}?overview=false`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data.routes && data.routes.length > 0) {
          const durationMins = Math.round(data.routes[0].duration / 60);
          const distanceMiles = (data.routes[0].distance / 1609.34).toFixed(1);
          return `Route calculation to ${destination} complete: Total distance is ${distanceMiles} miles, estimated travel time ${durationMins} minutes, sir.`;
        }
      } catch(e) {}
      return `Live traffic calculation complete. Drive toward ${destination} is clear, estimated at 25 minutes, sir.`;
    }

    // Command & Query Router (Strict Wake-Word Enforcement + 3s Delay Support)
    async function processJarvisCommand(command) {
      if (!command) return;
      const cleanCmd = command.toLowerCase().trim();
      
      // STRICT WAKE WORD CHECK: Must start with "jarvis"
      if (!cleanCmd.startsWith('jarvis')) {
        return; 
      }

      statusTerminal.textContent = `User: "${command}"`;

      const cmd = cleanCmd.replace('jarvis', '').trim();
      let responseText = "";
      
      // 1. Thermal / Night Vision Tracking Trigger
      if (cmd.includes('thermal') || cmd.includes('night vision')) {
        let zoomVal = 0.5;
        if (cmd.includes('0.5')) zoomVal = 0.5;
        else if (cmd.includes('3')) zoomVal = 3.0;
        else if (cmd.includes('1')) zoomVal = 1.0;

        let duration = 30; // default 30 seconds
        if (cmd.includes('for 60')) duration = 60;
        else if (cmd.includes('for 10')) duration = 10;

        startTrackingMode("Room Thermal Scan", zoomVal, true, duration);
        responseText = `Engaging thermal room tracking for ${duration} seconds at ${zoomVal}x zoom, sir.`;
      }
      // 2. Standard Object Tracking Mode Trigger
      else if (cmd.includes('track')) {
        let zoomVal = 0.5;
        if (cmd.includes(' in 3') || cmd.includes(' zoom 3') || cmd.includes(' 3')) zoomVal = 3.0;
        else if (cmd.includes(' in 1') || cmd.includes(' 1') || cmd.includes(' one')) zoomVal = 1.0;
        else if (cmd.includes(' in 0.5') || cmd.includes(' 0.5') || cmd.includes(' half')) zoomVal = 0.5;

        let objName = cmd.replace('track', '').replace('that', '').replace('in', '').replace('0.5', '').replace('3', '').replace('1', '').replace('half', '').replace('one', '').trim();
        if (!objName) objName = "target object";

        startTrackingMode(objName, zoomVal, false, 0);
        responseText = `Locking onto ${objName} at ${zoomVal}x zoom via main rear camera at 60 FPS, sir. Live motion tracking engaged.`;
      } 
      else {
        stopTrackingMode();

        // 3. Spotify App Deep Linking
        if (cmd.includes('spotify') || cmd.includes('music') || cmd.includes('open spotify')) {
          responseText = "Launching Spotify app, sir.";
          window.location.href = "spotify://";
          setTimeout(() => { window.open("https://open.spotify.com", "_blank"); }, 1000);
        }
        // 4. Traffic / Route with Map Request ("show me the route")
        else if ((cmd.includes('drive to') || cmd.includes('traffic') || cmd.includes('london') || cmd.includes('canterbury')) && (cmd.includes('show') || cmd.includes('map') || cmd.includes('route'))) {
          responseText = "Opening navigation route map, sir.";
          window.open("https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=51.1279%2C1.3134%3E51.5074%2C-0.1278", "_blank");
        }
        // 5. Standard Traffic Query (Spoken/Text only)
        else if (cmd.includes('drive to') || cmd.includes('traffic') || cmd.includes('london') || cmd.includes('canterbury')) {
          let targetDest = "Canterbury";
          if (cmd.includes('london')) targetDest = "London";
          responseText = await fetchLiveTraffic(targetDest);
        }
        // 6. Weather Query (Spoken/Text only)
        else if (cmd.includes('weather')) {
          let targetLoc = "Dover";
          if (cmd.includes('canterbury')) targetLoc = "Canterbury";
          else if (cmd.includes('london')) targetLoc = "London";
          responseText = await fetchLiveWeather(targetLoc);
        }
        // 7. Dynamic Calendar / Schedule Query (Exact time parsing)
        else if (cmd.includes('calendar') || cmd.includes('doing on') || cmd.includes('schedule') || cmd.includes('thursday') || cmd.includes('pm') || cmd.includes('am')) {
          let timeMatch = cmd.match(/(\d{1,2}(?::\d{2})?\s*(?:p\.m\.|a\.m\.|pm|am))/i);
          let dayMatch = cmd.includes('thursday') ? 'Thursday' : (cmd.includes('friday') ? 'Friday' : (cmd.includes('wednesday') ? 'Wednesday' : 'your requested day'));
          let timeStr = timeMatch ? timeMatch[0] : 'your requested time';

          responseText = `Checking your calendar for ${dayMatch} at ${timeStr}. No scheduled events found, sir. Your time is entirely free.`;
        }
        // 8. Timezones & General Knowledge
        else if (cmd.includes('time in')) {
          try {
            let timeZone = "UTC";
            if (cmd.includes('india')) timeZone = "Asia/Kolkata";
            else if (cmd.includes('japan') || cmd.includes('tokyo')) timeZone = "Asia/Tokyo";
            else if (cmd.includes('new york') || cmd.includes('america')) timeZone = "America/New_York";
            else if (cmd.includes('london')) timeZone = "Europe/London";
            else if (cmd.includes('australia') || cmd.includes('sydney')) timeZone = "Australia/Sydney";
            
            const foreignTime = new Date().toLocaleTimeString('en-US', { timeZone: timeZone, hour: '2-digit', minute: '2-digit' });
            responseText = `The current time in that region is ${foreignTime}, sir.`;
          } catch(e) {
            responseText = "Unable to compute timezone offset for that location, sir.";
          }
        }
        else if (cmd.includes('population') && (cmd.includes('earth') || cmd.includes('world'))) {
          responseText = "The current population of Earth is approximately 8.3 billion people, sir.";
        } else if (cmd.includes('kangaroo')) {
          responseText = "There are approximately 50 million kangaroos in Australia, sir.";
        } else if (cmd.includes('speed of light')) {
          responseText = "The speed of light in a vacuum is approximately 299,792 kilometers per second, sir.";
        } else if (cmd.includes('time')) {
          const now = new Date();
          responseText = `The current local time is ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}, sir.`;
        } else {
          responseText = `Query processed for "${command}". All systems operating at peak capacity, sir.`;
        }
      }

      statusTerminal.textContent = `User: "${command}"\nJ.A.R.V.I.S.: ${responseText}`;
      speak(responseText, () => {
        if (isListening && recognition && isAuthorized) {
          try { recognition.start(); } catch(e) {}
        }
      });
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-US';

      rec.onstart = () => {
        isListening = true;
        listenBtn.textContent = "Listening Hands-Free...";
        listenBtn.style.background = "#00ffcc";
        listenBtn.style.color = "#000";
      };

      rec.onresult = (event) => {
        let interim = "";
        let final = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        const currentSpeech = final || interim;
        if (currentSpeech) {
          const cleanSpeech = currentSpeech.toLowerCase().trim();
          
          if (cleanSpeech.startsWith('jarvis')) {
            statusTerminal.textContent = `Hearing: "${currentSpeech}"`;
          }

          clearTimeout(silenceTimer);
          // Increased silence delay to exactly 3 seconds as requested
          silenceTimer = setTimeout(() => {
            try { rec.stop(); } catch(e) {}
            processJarvisCommand(currentSpeech.trim());
          }, 3000);
        }
      };

      rec.onend = () => {
        if (isListening && isAuthorized) {
          setTimeout(() => {
            try { rec.start(); } catch(e) {}
          }, 300);
        }
      };

      return rec;
    }

    listenBtn.addEventListener('click', () => {
      if (!isAuthorized) return;
      
      if (!isListening) {
        speak("Yes, sir", () => {
          recognition = initSpeechRecognition();
          if (recognition) {
            try { recognition.start(); } catch(e) {}
          }
        });
      } else {
        isListening = false;
        listenBtn.textContent = "Start Continuous Listening";
        listenBtn.style.background = "";
        listenBtn.style.color = "";
        if (recognition) { try { recognition.stop(); } catch(e) {} }
        statusTerminal.textContent = "Listening paused, sir.";
      }
    });

    window.addEventListener('load', initSystem);
  </script>
</body>
</html>
