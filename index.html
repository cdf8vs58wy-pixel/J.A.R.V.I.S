<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S. HUD - Advanced Tactical Interface</title>
  <style>
    :root {
      --jarvis-cyan: #00ffcc;
      --jarvis-dark: #00140f;
      --jarvis-neon: #39ff14;
      --jarvis-red: #ff0033;
    }

    body {
      background-color: #000;
      color: var(--jarvis-cyan);
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 10px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 3px;
      margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
    }

    .main-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 12px;
      max-width: 100vw;
      margin: 0 auto;
    }

    .hud-left {
      flex: 1;
      max-width: 380px;
      margin: 0 auto;
    }

    .dashboard-panel {
      display: none;
      background: rgba(0, 20, 15, 0.95);
      border: 2px solid var(--jarvis-cyan);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: left;
      font-size: 11px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.25);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .dash-box {
      background: rgba(0, 40, 30, 0.6);
      border: 1px dashed var(--jarvis-cyan);
      padding: 8px;
      border-radius: 4px;
    }

    .hud-container {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 10px auto;
    }

    .ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px dashed var(--jarvis-cyan);
      border-radius: 50%;
      animation: spin 12s linear infinite;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .inner-ring {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border: 2px solid rgba(0, 255, 204, 0.4);
      border-radius: 50%;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }

    #authBox {
      display: block;
      width: 160px;
      height: 120px;
      margin: 0 auto 10px auto;
      border: 2px solid var(--jarvis-cyan);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
      background: #000;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #listenBtn {
      background-color: var(--jarvis-dark);
      color: var(--jarvis-cyan);
      border: 2px solid var(--jarvis-cyan);
      padding: 12px 24px;
      font-size: 14px;
      font-family: monospace;
      border-radius: 25px;
      cursor: pointer;
      margin: 10px 0;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.3);
      transition: all 0.3s ease;
    }

    .terminal {
      background: rgba(0, 20, 15, 0.85);
      border: 1px solid var(--jarvis-cyan);
      padding: 12px;
      border-radius: 8px;
      max-width: 360px;
      margin: 0 auto;
      text-align: left;
      font-size: 11px;
      min-height: 90px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.15);
      position: relative;
    }

    .loader-dots {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .loader-dot {
      width: 10px;
      height: 10px;
      background-color: var(--jarvis-neon);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--jarvis-neon);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .loader-dot:nth-child(1) { animation-delay: 0s; }
    .loader-dot:nth-child(2) { animation-delay: 0.2s; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-12px); opacity: 1; }
    }

    #tacticalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #tacticalVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    #tacticalCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    #exitTacticalBtn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10000;
      background: rgba(255, 0, 51, 0.85);
      color: #fff;
      border: 2px solid #ff0033;
      padding: 10px 18px;
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
    }

    .jarvis-tactical-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 20, 15, 0.95);
      border-top: 2px solid var(--jarvis-cyan);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      font-size: 14px;
      color: var(--jarvis-cyan);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <h1>J.A.R.V.I.S. SECURITY HUD</h1>

  <div class="main-container">
    <div class="hud-left">
      <div id="authBox">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="scanCanvas" style="display:none;"></canvas>
      </div>

      <div id="dashboardPanel" class="dashboard-panel">
        <div style="color:var(--jarvis-neon); font-weight:bold; border-bottom:1px solid var(--jarvis-cyan); padding-bottom:4px; margin-bottom:6px;">
          [STARK INDUSTRIES HUD TELEMETRY]
        </div>
        <div class="dashboard-grid">
          <div class="dash-box">
            <span style="color:#88ffcc;">LOCAL TIME</span><br>
            <b id="dashTime" style="color:var(--jarvis-neon); font-size:13px;">--:--</b>
          </div>
          <div class="dash-box">
            <span style="color:#88ffcc;">WEATHER (DOVER)</span><br>
            <b id="dashWeather" style="color:var(--jarvis-neon); font-size:12px;">Loading...</b>
          </div>
        </div>
      </div>

      <div class="hud-container">
        <div class="ring"></div>
        <div class="inner-ring"></div>
      </div>

      <button id="listenBtn">Tap to Initiate Security Scan</button>

      <div class="terminal" id="statusTerminal">System standby. Tap the button above to run biometric facial verification.</div>
    </div>
  </div>

  <div id="tacticalOverlay">
    <button id="exitTacticalBtn">✖ EXIT TRACKING HUD</button>
    <video id="tacticalVideo" autoplay playsinline muted></video>
    <canvas id="tacticalCanvas"></canvas>
    <div class="jarvis-tactical-bar">
      <span id="sysModeStatus">SYS: 60 FPS ACTIVE</span>
      <span id="tacticalTargetStatus">TARGET: OBJECT</span>
      <span>ZOOM: <span id="tacticalZoom">0.5X</span></span>
    </div>
  </div>

  <iframe id="appLauncherFrame" style="display:none;"></iframe>

  <script>
    // Your restricted Gemini API Key
    const GEMINI_API_KEY = "AQ.Ab8RN6LR2f0FGK6q-yJLKKkIFycyicHLG4PNUpITnC48PsgvAQ";

    const listenBtn = document.getElementById('listenBtn');
    const statusTerminal = document.getElementById('statusTerminal');
    const webcam = document.getElementById('webcam');
    const scanCanvas = document.getElementById('scanCanvas');
    const authBox = document.getElementById('authBox');
    const dashboardPanel = document.getElementById('dashboardPanel');
    const dashTime = document.getElementById('dashTime');
    const dashWeather = document.getElementById('dashWeather');
    const appLauncherFrame = document.getElementById('appLauncherFrame');
    
    const tacticalOverlay = document.getElementById('tacticalOverlay');
    const exitTacticalBtn = document.getElementById('exitTacticalBtn');
    const tacticalVideo = document.getElementById('tacticalVideo');
    const tacticalCanvas = document.getElementById('tacticalCanvas');
    const tacticalTargetStatus = document.getElementById('tacticalTargetStatus');
    const tacticalZoom = document.getElementById('tacticalZoom');
    const sysModeStatus = document.getElementById('sysModeStatus');

    let recognition = null;
    let isListening = false;
    let isAuthorized = false;
    let cameraStream = null;
    let userLat = 51.1279; 
    let userLon = 1.3134;

    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let isWhispering = false;

    let isTrackingActive = false;
    let trackedObjectName = "";
    let trackX = 300, trackY = 200;
    let canvasCtx = null;
    let scanCtx = null;
    let lastFrameTime = 0;
    const targetFPS = 60;
    const frameInterval = 1000 / targetFPS;

    window.addEventListener('load', async () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => { userLat = pos.coords.latitude; userLon = pos.coords.longitude; },
          (err) => {},
          { enableHighAccuracy: true, timeout: 5000 }
        );
      }

      try {
        const constraints = {
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 },
            advanced: [{ zoom: 0.5 }]
          }
        };
        cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcam.srcObject = cameraStream;
        await webcam.play();
      } catch(e) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
          webcam.srcObject = cameraStream;
          await webcam.play();
        } catch(ex) {}
      }

      setInterval(updateTelemetryDisplay, 1000);
      updateTelemetryDisplay();
    });

    async function updateTelemetryDisplay() {
      const now = new Date();
      dashTime.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${userLat}&longitude=${userLon}&current_weather=true`);
        const data = await res.json();
        if (data && data.current_weather) {
          dashWeather.textContent = `${Math.round(data.current_weather.temperature)}°C | ${Math.round(data.current_weather.windspeed)} km/h`;
        }
      } catch(e) {
        dashWeather.textContent = "16°C | Clear";
      }
    }

    async function initAudioAnalyser() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 512;
        detectVolumeLoop();
      } catch(e) {}
    }

    function detectVolumeLoop() {
      if (!analyser) return;
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
      let avg = sum / dataArray.length;
      
      isWhispering = (avg > 1.5 && avg < 16);
      requestAnimationFrame(detectVolumeLoop);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        if (isWhispering) {
          utterance.volume = 0.3;
          utterance.pitch = 0.5;
          utterance.rate = 0.85;
        } else {
          utterance.volume = 1.0;
          utterance.pitch = 0.9;
          utterance.rate = 1.0;
        }
        window.speechSynthesis.speak(utterance);
      }
    }

    async function startBiometricAuth() {
      if (isAuthorized) {
        toggleListeningState();
        return;
      }

      listenBtn.disabled = true;
      listenBtn.textContent = "Scanning 0.5X Wide Field...";
      statusTerminal.textContent = "Analyzing facial signature matrix...";
      speak("Scanning face profile.");

      await initAudioAnalyser();

      const ctx = scanCanvas.getContext('2d');
      scanCanvas.width = 160;
      scanCanvas.height = 120;
      ctx.drawImage(webcam, 0, 0, 160, 120);
      const imgData = ctx.getImageData(0, 0, 160, 120).data;
      
      let rSum = 0, gSum = 0, bSum = 0, totalPixels = 0, skinPixels = 0;

      for (let i = 0; i < imgData.length; i += 4) {
        let r = imgData[i], g = imgData[i+1], b = imgData[i+2];
        rSum += r; gSum += g; bSum += b;
        totalPixels++;

        let isSkin = (r > 95 && g > 40 && b > 20 && Math.max(r,g,b) - Math.min(r,g,b) > 15 && Math.abs(r - g) > 15 && r > g && r > b);
        if (isSkin) skinPixels++;
      }
      
      const currentAvgR = rSum / totalPixels;
      const currentAvgG = gSum / totalPixels;
      const currentAvgB = bSum / totalPixels;
      const skinPercentage = (skinPixels / totalPixels) * 100;

      if (skinPercentage < 8) {
        listenBtn.disabled = false;
        listenBtn.textContent = "Tap to Initiate Security Scan";
        statusTerminal.textContent = "Security Error: No human face detected in frame. Access Denied.";
        speak("No face detected in frame, sir.");
        return;
      }

      let savedSig = localStorage.getItem('jarvis_owner_face');
      
      if (!savedSig) {
        let ownerSig = { r: currentAvgR, g: currentAvgG, b: currentAvgB, skinPct: skinPercentage };
        localStorage.setItem('jarvis_owner_face', JSON.stringify(ownerSig));
        statusTerminal.textContent = "Biometric Enrollment Complete: Primary User face locked.";
      } else {
        let ownerSig = JSON.parse(savedSig);
        let diffR = Math.abs(ownerSig.r - currentAvgR);
        let diffG = Math.abs(ownerSig.g - currentAvgG);
        let diffB = Math.abs(ownerSig.b - currentAvgB);
        let diffSkin = Math.abs(ownerSig.skinPct - skinPercentage);

        if (diffR > 35 || diffG > 35 || diffB > 35 || diffSkin > 25) {
          listenBtn.disabled = false;
          listenBtn.textContent = "Tap to Initiate Security Scan";
          statusTerminal.textContent = "SECURITY ALERT: ACCESS DENIED.\nFacial signature mismatch.";
          speak("Access denied. Unrecognized facial signature.");
          return;
        }
      }

      setTimeout(() => { statusTerminal.textContent = "Locking facial signature...\n1..."; speak("1."); }, 1000);
      setTimeout(() => { statusTerminal.textContent = "Locking facial signature...\n1... 2..."; speak("2."); }, 2000);
      setTimeout(() => { statusTerminal.textContent = "Locking facial signature...\n1... 2... 3..."; speak("3."); }, 3000);

      setTimeout(() => {
        isAuthorized = true;
        authBox.style.display = 'none';
        dashboardPanel.style.display = 'block';

        statusTerminal.textContent = "Biometric Security Check: SUCCESS\nWelcome back, sir.";
        speak("Face verified. Welcome back, sir.");

        listenBtn.disabled = false;
        listenBtn.textContent = "Pause Continuous Listening";
        
        recognition = initSpeechRecognition();
        if (recognition) { try { recognition.start(); } catch(e) {} }
      }, 4000);
    }

    async function startTrackingMode(objectName) {
      isTrackingActive = true;
      let cleanObj = objectName.replace("o'clock", "clock").replace("the clock", "clock").trim();
      if (!cleanObj) cleanObj = "light";
      trackedObjectName = cleanObj;
      
      sysModeStatus.textContent = "SYS: 60 FPS ACTIVE";
      tacticalTargetStatus.textContent = `TARGET: ${trackedObjectName.toUpperCase()}`;
      tacticalZoom.textContent = "0.5X";
      tacticalOverlay.style.display = 'flex';

      try {
        const constraints = { video: { facingMode: { exact: 'environment' } } };
        cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch(e) {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
      }

      tacticalVideo.srcObject = cameraStream;
      tacticalVideo.onloadedmetadata = () => {
        tacticalCanvas.width = window.innerWidth;
        tacticalCanvas.height = window.innerHeight;
        canvasCtx = tacticalCanvas.getContext('2d');
        
        scanCanvas.width = 160;
        scanCanvas.height = 120;
        scanCtx = scanCanvas.getContext('2d');

        trackX = tacticalCanvas.width / 2;
        trackY = tacticalCanvas.height / 2;

        requestAnimationFrame(runTrackingLoop);
      };
    }

    function stopTrackingMode() {
      isTrackingActive = false;
      tacticalOverlay.style.display = 'none';
      if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); }
      speak("Tracking disengaged, sir.");
      statusTerminal.textContent = "Tracking disengaged. Returning to normal HUD mode.";
    }

    exitTacticalBtn.addEventListener('click', stopTrackingMode);

    function runTrackingLoop(timestamp) {
      if (!isTrackingActive || !canvasCtx || !scanCtx) return;

      if (!lastFrameTime) lastFrameTime = timestamp;
      const elapsed = timestamp - lastFrameTime;

      if (elapsed >= frameInterval) {
        lastFrameTime = timestamp - (elapsed % frameInterval);
        canvasCtx.clearRect(0, 0, tacticalCanvas.width, tacticalCanvas.height);

        scanCtx.drawImage(tacticalVideo, 0, 0, scanCanvas.width, scanCanvas.height);
        const imgData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
        const data = imgData.data;

        let targetXSum = 0, targetYSum = 0, targetPixelCount = 0;

        for (let y = 5; y < scanCanvas.height - 5; y += 4) {
          for (let x = 5; x < scanCanvas.width - 5; x += 4) {
            const idx = (y * scanCanvas.width + x) * 4;
            const r = data[idx], g = data[idx+1], b = data[idx+2];
            const brightness = (r + g + b) / 3;

            if (brightness > 160) {
              targetXSum += x;
              targetYSum += y;
              targetPixelCount++;
            }
          }
        }

        if (targetPixelCount > 3) {
          const avgX = (targetXSum / targetPixelCount) * (tacticalCanvas.width / scanCanvas.width);
          const avgY = (targetYSum / targetPixelCount) * (tacticalCanvas.height / scanCanvas.height);
          trackX += (avgX - trackX) * 0.25;
          trackY += (avgY - trackY) * 0.25;
        } else {
          trackX += Math.sin(timestamp * 0.005) * 8;
          trackY += Math.cos(timestamp * 0.005) * 8;
        }

        canvasCtx.beginPath();
        canvasCtx.arc(trackX, trackY, 55, 0, 2 * Math.PI);
        canvasCtx.strokeStyle = "#39ff14"; 
        canvasCtx.lineWidth = 5; 
        canvasCtx.stroke();

        canvasCtx.fillStyle = "#39ff14";
        canvasCtx.font = "bold 14px monospace";
        canvasCtx.fillText(`[LOCKED: ${trackedObjectName.toUpperCase()}]`, trackX - 75, trackY - 65);
      }

      requestAnimationFrame(runTrackingLoop);
    }

    async function queryLLMBrain(query) {
      statusTerminal.innerHTML = `User: "${query}"<br><div class="loader-dots"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `You are J.A.R.V.I.S., Tony Stark's AI assistant. Answer the following question accurately, concisely, and professionally as J.A.R.V.I.S., ending your response with 'sir.' Question: ${query}` }]
            }]
          })
        });

        const data = await response.json();
        if (data && data.candidates && data.candidates[0].content.parts[0].text) {
          return data.candidates[0].content.parts[0].text.trim();
        }
      } catch(e) {}

      return "Neural connection error. Unable to reach deep intelligence cluster, sir.";
    }

    async function getDiagnosticsReport() {
      let batteryPct = "100%";
      let chargingStatus = "External Grid Power";
      if ('getBattery' in navigator) {
        try {
          const battery = await navigator.getBattery();
          batteryPct = Math.round(battery.level * 100) + "%";
          chargingStatus = battery.charging ? "Connected & Charging" : "Internal Battery Power";
        } catch(e) {}
      }
      return `Diagnostics complete, sir. System battery is at ${batteryPct}, running on ${chargingStatus}. CPU load 4.2 percent, tactical sensors nominal, uplink stable.`;
    }

    async function processJarvisCommand(command) {
      if (!command) return;
      let cmd = command.toLowerCase().trim();

      cmd = cmd.replace(/^jarvis/i, '').replace(/^hey jarvis/i, '').trim();
      if (!cmd) return;

      let responseText = "";

      if (cmd.includes('disengage') || cmd.includes('stop tracking') || cmd.includes('exit')) {
        stopTrackingMode();
        return;
      }
      else if (cmd.includes('diagnostic') || cmd.includes('battery')) {
        responseText = await getDiagnosticsReport();
      }
      else if (cmd.includes('open ')) {
        let appName = cmd.replace('open', '').trim();
        let scheme = appName + "://";
        if (appName.includes('spotify')) scheme = "spotify://";
        else if (appName.includes('youtube')) scheme = "youtube://";
        else if (appName.includes('instagram')) scheme = "instagram://";
        else if (appName.includes('tiktok')) scheme = "snssdk1233://";
        else if (appName.includes('whatsapp')) scheme = "whatsapp://";
        else if (appName.includes('maps')) scheme = "maps://";
        
        appLauncherFrame.src = scheme;
        responseText = `Launching ${appName}, sir.`;
      }
      else if (cmd.includes('track') || cmd.includes('truck') || cmd.includes('follow')) {
        let objName = cmd.replace('track', '').replace('truck', '').replace('follow', '').trim();
        startTrackingMode(objName || "light");
        responseText = `Locking onto target, sir.`;
      }
      else {
        responseText = await queryLLMBrain(cmd);
      }

      statusTerminal.textContent = `User: "${command}"\nJ.A.R.V.I.S.: ${responseText}`;
      speak(responseText);
      if (isListening && recognition && isAuthorized) {
        try { recognition.start(); } catch(e) {}
      }
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-US';

      rec.onstart = () => { isListening = true; };

      rec.onresult = (event) => {
        let finalTranscript = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
        }
        if (finalTranscript.trim()) {
          processJarvisCommand(finalTranscript.trim());
        }
      };

      rec.onend = () => {
        if (isListening && isAuthorized) {
          setTimeout(() => { try { rec.start(); } catch(e) {} }, 300);
        }
      };

      return rec;
    }

    function toggleListeningState() {
      if (!isListening) {
        isListening = true;
        listenBtn.textContent = "Pause Continuous Listening";
        recognition = initSpeechRecognition();
        if (recognition) { try { recognition.start(); } catch(e) {} }
      } else {
        isListening = false;
        listenBtn.textContent = "Resume Continuous Listening";
        if (recognition) { try { recognition.stop(); } catch(e) {} }
      }
    }

    listenBtn.addEventListener('click', startBiometricAuth);
  </script>
</body>
</html>
